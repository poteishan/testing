<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Code Battle</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --bg: #f2f4fa;
            --card: #fff;
            --ink: #12162b;
            --mut: #5d6483;
            --line: #dfe3f1;
            --acc: #4635e8;
            --acc-ink: #fff;
            --hot: #e8470f;
            --ok: #0f8a5f;
            --bad: #c9263d;
            --sh: 0 1px 0 rgba(18, 22, 43, .04);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --f: "Space Grotesk", system-ui, sans-serif;
            --m: "JetBrains Mono", ui-monospace, Menlo, monospace
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #0d1022;
                --card: #161a33;
                --ink: #eceefa;
                --mut: #9aa1c4;
                --line: #262b4d;
                --acc: #948cff;
                --acc-ink: #0d1022;
                --hot: #ff7a45;
                --ok: #3ddc97;
                --bad: #ff6b7f
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0d1022;
            --card: #161a33;
            --ink: #eceefa;
            --mut: #9aa1c4;
            --line: #262b4d;
            --acc: #948cff;
            --acc-ink: #0d1022;
            --hot: #ff7a45;
            --ok: #3ddc97;
            --bad: #ff6b7f
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.55 var(--f)
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        :focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            background: var(--bg);
            border-bottom: 1px solid var(--line)
        }

        .bar {
            max-width: 1120px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            flex-wrap: wrap
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            margin-right: auto;
            display: flex;
            gap: 8px;
            align-items: center
        }

        .logo i {
            font: 500 13px var(--m);
            background: var(--acc);
            color: var(--acc-ink);
            padding: 2px 6px;
            border-radius: 5px;
            font-style: normal
        }

        nav a {
            padding: 6px 10px;
            border-radius: 8px;
            color: var(--mut)
        }

        nav a.on,
        nav a:hover {
            color: var(--ink);
            background: var(--card)
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--card);
            padding: 7px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 500
        }

        .btn.p {
            background: var(--acc);
            color: var(--acc-ink);
            border-color: var(--acc)
        }

        .btn.d {
            color: var(--bad)
        }

        .btn.s {
            padding: 4px 10px;
            font-size: 13px
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        main {
            max-width: 1120px;
            margin: auto;
            padding: 24px 16px 60px
        }

        h1 {
            font-size: 30px;
            line-height: 1.15;
            margin: 0 0 4px;
            letter-spacing: -.02em
        }

        h2 {
            font-size: 19px;
            margin: 0 0 12px
        }

        .mut {
            color: var(--mut)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 18px;
            box-shadow: var(--sh)
        }

        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .sp {
            justify-content: space-between
        }

        .tag {
            font: 500 12px var(--m);
            padding: 2px 8px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--mut)
        }

        .tag.live {
            color: var(--hot);
            border-color: var(--hot)
        }

        .tag.closed {
            color: var(--mut)
        }

        .tag.upcoming {
            color: var(--acc);
            border-color: var(--acc)
        }

        .tag.draft {
            border-style: dashed
        }

        .tag.ok {
            color: var(--ok);
            border-color: var(--ok)
        }

        .tag.bad {
            color: var(--bad);
            border-color: var(--bad)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line)
        }

        th {
            font-size: 13px;
            color: var(--mut);
            font-weight: 500
        }

        .tw {
            overflow-x: auto
        }

        .num {
            font-family: var(--m)
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 9px 11px
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin: 12px 0 4px
        }

        .hero {
            padding: 48px 0 28px;
            max-width: 760px
        }

        .hero h1 {
            font-size: clamp(38px, 7vw, 68px);
            letter-spacing: -.035em
        }

        .stage {
            display: flex;
            gap: 0;
            margin: 26px 0;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--card)
        }

        .stage div {
            flex: 1;
            min-width: 170px;
            padding: 16px;
            border-right: 1px solid var(--line)
        }

        .stage div:last-child {
            border: 0
        }

        .stage b {
            display: block
        }

        .timer {
            font: 700 26px var(--m);
            color: var(--hot)
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            cursor: pointer
        }

        .opt.sel {
            border-color: var(--acc);
            box-shadow: inset 0 0 0 1px var(--acc)
        }

        .code {
            font: 13px/1.6 var(--m);
            min-height: 300px;
            resize: vertical;
            tab-size: 2;
            white-space: pre
        }

        .out {
            font: 13px var(--m);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 10px;
            min-height: 56px;
            white-space: pre-wrap
        }

        .split {
            display: grid;
            gap: 14px;
            grid-template-columns: 1fr 1.3fr
        }

        @media(max-width:800px) {
            .split {
                grid-template-columns: 1fr
            }
        }

        .me td {
            background: color-mix(in srgb, var(--acc) 12%, transparent);
            font-weight: 700
        }

        .rk {
            font: 700 15px var(--m);
            width: 48px
        }

        .bar2 {
            height: 6px;
            border-radius: 9px;
            background: var(--line);
            overflow: hidden
        }

        .bar2 i {
            display: block;
            height: 100%;
            background: var(--acc)
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 20, .55);
            display: grid;
            place-items: center;
            padding: 16px;
            z-index: 20
        }

        .modal .card {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow: auto
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 16px;
            border-radius: 10px;
            z-index: 30;
            display: none
        }

        .ov {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
        }

        .st {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 12px;
            padding: 14px
        }

        .st.hi {
            background: var(--acc);
            color: var(--acc-ink);
            border-color: var(--acc)
        }

        .st small {
            display: block;
            color: var(--mut)
        }

        .st.hi small {
            color: inherit;
            opacity: .8
        }

        .st b {
            font-size: 26px;
            letter-spacing: -.02em
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 140px;
            margin-top: 10px
        }

        .bars i {
            flex: 1;
            background: var(--acc);
            border-radius: 3px 3px 0 0;
            min-height: 3px
        }

        .bars i.z {
            opacity: .2
        }

        .ax {
            display: flex;
            justify-content: space-between;
            font: 12px var(--m);
            color: var(--mut);
            margin-top: 6px
        }

        .seg {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 3px
        }

        .seg button {
            border: 0;
            background: none;
            padding: 3px 12px;
            border-radius: 99px;
            cursor: pointer;
            color: var(--mut)
        }

        .seg button.on {
            background: var(--bg);
            color: var(--acc);
            font-weight: 700
        }

        .cal {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(7, 14px);
            grid-auto-columns: 14px;
            gap: 3px;
            overflow-x: auto;
            padding-bottom: 6px
        }

        .cal i {
            border-radius: 3px;
            background: var(--line)
        }

        .hb {
            display: grid;
            grid-template-columns: 44px 1fr 56px;
            gap: 10px;
            align-items: center;
            margin: 7px 0;
            font-size: 14px
        }

        .hb span:last-child {
            text-align: right
        }

        .mk {
            position: relative
        }

        .mk u {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 2px;
            background: var(--hot)
        }

        .up {
            color: var(--ok)
        }

        .dn {
            color: var(--bad)
        }

        .two {
            display: grid;
            gap: 14px;
            grid-template-columns: 1fr 1fr
        }

        @media(max-width:800px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        .ach {
            opacity: .75
        }

        .ach.on {
            opacity: 1;
            background: var(--acc);
            color: var(--acc-ink)
        }

        .ach.on .mut {
            color: inherit
        }

        .mw {
            position: relative
        }

        .av {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--acc);
            color: var(--acc-ink);
            font-weight: 700;
            cursor: pointer;
            display: grid;
            place-items: center;
            padding: 0
        }

        .av.big {
            width: 64px;
            height: 64px;
            font-size: 22px;
            cursor: default
        }

        .menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 240px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px;
            z-index: 15;
            box-shadow: 0 10px 30px rgba(5, 7, 20, .25)
        }

        .menu[hidden] {
            display: none
        }

        .menu .mh {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            padding: 10px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 6px
        }

        .menu a,
        .menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 9px 10px;
            border-radius: 8px;
            border: 0;
            background: none;
            cursor: pointer
        }

        .menu a:hover,
        .menu button:hover {
            background: var(--bg)
        }

        .menu button {
            color: var(--bad)
        }

        .empty {
            text-align: center;
            padding: 36px;
            color: var(--mut)
        }

        @media(prefers-reduced-motion:no-preference) {
            .pulse {
                animation: p 1.6s infinite
            }

            @keyframes p {
                50% {
                    opacity: .35
                }
            }
        }
    </style>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>

<body>
    <header>
        <div class="bar" id="top"></div>
    </header>
    <main id="app"></main>
    <div id="toast" role="status"></div>
    <script>
        const $ = s => document.querySelector(s); let U = null, pub = false, uid = 100, tick = null;
        let rounds = [
            { id: 1, name: "Quiz Battle", type: "quiz", status: "live", dur: 20, cut: 60, desc: "Rapid-fire MCQs on algorithms, web and systems. Instant scoring." },
            { id: 2, name: "Coding Battle", type: "code", status: "upcoming", dur: 45, cut: 50, desc: "Solve problems against hidden test cases. Partial credit per case." },
            { id: 3, name: "Debugging Battle", type: "debug", status: "upcoming", dur: 30, cut: 50, desc: "Broken code, your fix. Every failing test you turn green scores." },
            { id: 4, name: "Final Battle", type: "code", status: "draft", dur: 60, cut: 0, desc: "Advanced problems. Weighted tests and a speed tie-breaker." }];
        let qs = [
            { id: 1, r: 1, t: "Time complexity of binary search?", pts: 10, opts: ["O(n)", "O(log n)", "O(n log n)", "O(1)"], ans: 1 },
            { id: 2, r: 1, t: "Which HTTP status means Not Found?", pts: 10, opts: ["200", "301", "404", "500"], ans: 2 },
            { id: 3, r: 1, t: "Which data structure uses LIFO order?", pts: 10, opts: ["Queue", "Stack", "Heap", "Graph"], ans: 1 },
            { id: 4, r: 1, t: "Which SQL clause filters grouped rows?", pts: 10, opts: ["WHERE", "GROUP BY", "HAVING", "ORDER BY"], ans: 2 },
            { id: 5, r: 2, t: "Two Sum", pts: 100, body: "Given an array and a target, return the indices of two numbers that add up to the target.", tests: 5, start: "function twoSum(nums, target) {\n  // your code\n}" },
            { id: 6, r: 3, t: "Fix the factorial", pts: 100, body: "This function returns wrong results for n = 0 and large n. Find the bugs.", tests: 4, start: "function fact(n) {\n  let r = 0;\n  for (let i = 1; i < n; i++) r *= i;\n  return r;\n}" }];
        let subs = [{ id: 1, u: "Aarav Mehta", r: 1, q: "Round total", s: 40, st: "graded" }, { id: 2, u: "Isha Rao", r: 1, q: "Round total", s: 30, st: "graded" }];
        let board = [["Aarav Mehta", 40, 0, 0, 0], ["Isha Rao", 30, 0, 0, 0], ["Kabir Shah", 40, 0, 0, 0], ["Meera Iyer", 20, 0, 0, 0], ["Rohan Das", 30, 0, 0, 0], ["Sana Qureshi", 10, 0, 0, 0], ["Vikram Joshi", 20, 0, 0, 0]].map((a, i) => ({ n: a[0], s: a.slice(1), t: 300 + i * 40 }));
        let me = { s: [0, 0, 0, 0], done: {} };
        try { const t = localStorage.getItem("cb-theme"); if (t) document.documentElement.dataset.theme = t } catch (e) { }
        function theme() { const d = document.documentElement, dark = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches; d.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("cb-theme", d.dataset.theme) } catch (e) { } paint() }
        function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.k); toast.k = setTimeout(() => t.style.display = "none", 2400) }
        const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const tot = s => s.reduce((a, b) => a + b, 0);
        function ranked() { const a = board.map(b => ({ n: b.n, s: b.s, t: b.t, sum: tot(b.s) })); if (U && me.n) a.push({ n: U.name + " (you)", s: me.s, t: me.t || 0, sum: tot(me.s), me: 1 }); return a.sort((x, y) => y.sum - x.sum || x.t - y.t).map((x, i) => ({ ...x, rk: i + 1 })) }
        function paint() {
            const d = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
            const h = location.hash || "#/", lk = (p, l) => `<a href="${p}" class="${h.startsWith(p) ? "on" : ""}">${l}</a>`;
            $("#top").innerHTML = `<a class="logo" href="#/">Code Battle <i>{ }</i></a><nav class="row">${U ? (U.role === "admin" ? lk("#/admin/rounds", "Rounds") + lk("#/admin/questions", "Questions") + lk("#/admin/subs", "Submissions") + lk("#/admin/results", "Results") : lk("#/dashboard", "Rounds") + lk("#/quizzes", "Quizzes") + lk("#/perf", "My score") + lk("#/analytics", "Analyser") + lk("#/board", "Leaderboard")) : ""}</nav>
<button class="btn s" onclick="theme()" aria-label="Toggle light and dark mode">${d ? "Light mode" : "Dark mode"}</button>${U ? userMenu() : `<a class="btn s p" href="#/login">Log in</a>`}`
        }
        function route() {
            clearInterval(tick); RT.leave(); const h = location.hash || "#/", [, a, b] = h.split("/"); paint();
            const need = (r) => { if (!U) { location.hash = "#/login"; return 1 } if (r && U.role !== r) { location.hash = U.role === "admin" ? "#/admin/rounds" : "#/dashboard"; return 1 } };
            const A = $("#app"); window.scrollTo(0, 0);
            if (!a) { NEXT = null; return A.innerHTML = landing() }
            if (a === "login" || a === "register") return A.innerHTML = auth(a);
            if (a === "board") { if (!U) { NEXT = "#/board"; location.hash = "#/login"; return } return board_(A) }
            if (need(a === "admin" ? "admin" : "")) return;
            ({ dashboard: () => A.innerHTML = dash(), round: () => { A.innerHTML = lobby(+b); if (rounds.some(r => r.id === +b)) RT.join("r" + b, drawP) }, play: () => play(A, +b), perf: () => A.innerHTML = perf(), analytics: () => analytics(A), profile: () => profile(A), quizzes: () => quizzes(A), quiz: () => quizLobby(A, b), admin: () => admin(A, b) }[a] || (() => A.innerHTML = '<div class="empty">Page not found.</div>'))()
        }
        addEventListener("hashchange", route);
        const live = () => rounds.filter(r => r.status === "live");
        function landing() {
            return `<section class="hero"><p class="mut">Four rounds. One leaderboard. ${board.length + 1} coders already in.</p><h1>Out-think, out-code, out-debug everyone else.</h1><p class="mut" style="max-width:56ch">Code Battle is a timed online hackathon. Clear a quiz, solve problems, fix broken code, then face the final round. Scores update live and only qualifiers move on.</p><div class="row" style="margin-top:18px"><a class="btn p" href="#/register">Join the battle</a><a class="btn" href="#/board">Log in to see live rankings</a></div></section>
<div class="stage">${rounds.map((r, i) => `<div><span class="tag ${r.status}">${r.status}</span><b style="margin-top:8px">${esc(r.name)}</b><span class="mut">${r.dur} min · top score ${r.cut || "?"}% to qualify</span></div>`).join("")}</div>
<div class="grid"><div class="card"><h2>Fair clock</h2><p class="mut">Timers run on the server. Your screen only displays them.</p></div><div class="card"><h2>Instant scoring</h2><p class="mut">Quiz answers and code tests are graded the moment you submit.</p></div><div class="card"><h2>Live ranking</h2><p class="mut">Ties are broken by total time, so every second counts.</p></div></div>`}
        function auth(m) { const reg = m === "register"; return `<div class="card" style="max-width:420px;margin:30px auto"><h1 style="font-size:26px">${reg ? "Create your account" : "Welcome back"}</h1>${NEXT ? '<p class="mut">Log in to see the live rankings.</p>' : ""}<form onsubmit="return login(event,${reg})">${reg ? `<label>Full name</label><input name="n" required minlength="2">` : ""}<label>Email</label><input name="e" type="email" required><label>Password</label><input name="p" type="password" required minlength="6">${SB ? "" : '<label>Sign in as (demo only)</label><select name="r"><option value="user">Participant</option><option value="admin">Admin</option></select>'}<p id="aerr" role="alert" style="color:var(--bad);min-height:1.3em;margin:10px 0 0"></p><button class="btn p" style="width:100%;margin-top:16px">${reg ? "Create account" : "Log in"}</button></form><p class="mut">${!reg && SB ? `<a href="#" onclick="forgot();return false"><u>Forgot password?</u></a> · ` : ""}${reg ? `Have an account? <a href="#/login"><u>Log in</u></a>` : `New here? <a href="#/register"><u>Register</u></a>`}</p></div>` }
        async function login(e, reg) {
            e.preventDefault(); const f = new FormData(e.target), em = f.get("e").trim(), btn = e.target.querySelector("button.p"), er = $("#aerr"), lab = reg ? "Create account" : "Log in"; er.textContent = "";
            const go = () => { toast(reg ? "Account created" : "Logged in"); const nx = NEXT; NEXT = null; location.hash = nx || (U.role === "admin" ? "#/admin/rounds" : "#/dashboard") };
            if (!SB) { U = { name: f.get("n") || em.split("@")[0], role: f.get("r"), email: em }; me.n = U.name; go(); return false }
            btn.disabled = true; btn.textContent = "Please wait\u2026";
            try {

        document.addEventListener("keydown", e => { if (e.key === "Escape") { const m = $("#pm"); if (m) m.hidden = true } });
        async function histData() {
            if (SB && U.id) { const { data, error } = await SB.from("attempts").select("round_id,score,pct,status,started_at,time_seconds,rounds(name,cutoff_pct)").eq("user_id", U.id).order("started_at", { ascending: false }); if (error) throw error; return data.map(a => ({ name: a.rounds?.name, date: a.started_at, score: a.score, pct: a.pct, st: a.status, t: a.time_seconds, cut: a.rounds?.cutoff_pct || 0 })) }
            return subs.filter(s => s.u === U.name).map(s => { const r = rounds.find(x => x.id === s.r) || {}; return { name: r.name, date: Date.now(), score: s.s, pct: me.done[s.r] || 0, st: "submitted", t: 0, cut: r.cut || 0 } })
        }
        async function profile(A) {
            A.innerHTML = `<div class="row" style="gap:16px"><div class="av big">${esc(ini(U.name))}</div><div><h1>${esc(U.name)}</h1><p class="mut" style="margin:0">${esc(U.email || "")} \u00b7 ${U.role === "admin" ? "Admin" : "Participant"}</p></div></div><h2 style="margin-top:26px">Quiz and round history</h2><div id="hs" class="mut">Loading your history\u2026</div>`;
            try {
                const H = await histData(), e = $("#hs"); if (!e) return;
                if (!H.length) { e.innerHTML = `<div class="card empty">You have not joined a round yet.<br><a class="btn p" style="margin-top:12px;display:inline-block" href="#/dashboard">See open rounds</a></div>`; return }
                const done = H.filter(h => h.st !== "active"), q = done.filter(h => h.st === "submitted" && h.pct >= h.cut).length, best = Math.max(...H.map(h => h.pct || 0)), tm = s => s ? Math.floor(s / 60) + "m " + s % 60 + "s" : "\u2013";
                const res = h => h.st === "active" ? '<span class="tag live">in progress</span>' : h.st === "pending_grading" ? '<span class="tag">grading</span>' : h.pct >= h.cut ? '<span class="tag ok">qualified</span>' : '<span class="tag bad">not qualified</span>';
                e.className = ""; e.innerHTML = `<div class="ov" style="margin-bottom:14px"><div class="st"><small>Rounds joined</small><b>${H.length}</b></div><div class="st"><small>Qualified</small><b>${q}</b></div><div class="st"><small>Best score</small><b>${best}%</b></div></div>` + tbl(["Round", "Date", "Score", "Percent", "Time", "Result"], H.map(h => [esc(h.name || "Round"), new Date(h.date).toLocaleDateString("en", { day: "numeric", month: "short", year: "numeric" }), h.score, (h.pct || 0) + "%", tm(h.t), res(h)]))
            }
            catch (x) { const e = $("#hs"); if (e) e.innerHTML = `<div class="card empty">Could not load your history. ${esc(x.message || "")}</div>` }
        }
        let QZ = []; const rc = () => [...Array(6)].map(() => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)]).join("");
        const fq = id => { const q = QZ.find(x => x.id === id); if (!q) throw new Error("Quiz not found"); return q };
        const call = async (fn, args) => { const { data, error } = await SB.rpc(fn, args); if (error) throw new Error(error.message); return data };
        const QA = {
            mine: async () => SB ? call("my_quizzes") : QZ.filter(q => q.m.includes(U.name)).map(q => ({ ...q, is_host: q.host === U.name, members: q.m.length })),
            create: async (t, l, d) => { if (SB) return call("create_quiz", { p_title: t, p_limit: l, p_duration: d }); if (t.trim().length < 3) throw new Error("Title must be at least 3 characters"); const q = { id: "d" + (++uid), code: rc(), title: t.trim(), member_limit: l, duration_min: d, status: "lobby", host: U.name, m: [U.name] }; QZ.push(q); return q },
            join: async c => { c = c.trim().toUpperCase(); if (SB) return call("join_quiz", { p_code: c }); const q = QZ.find(x => x.code === c); if (!q) throw new Error("No quiz found with that code"); if (q.m.includes(U.name)) return q; if (q.status !== "lobby") throw new Error("This quiz has already started or closed"); if (q.m.length >= q.member_limit) throw new Error("This quiz is full"); q.m.push(U.name); return q },
            get: async id => { if (SB) { const { data, error } = await SB.from("quizzes").select("*").eq("id", id).single(); if (error) throw new Error("Quiz not found, or you have not joined it"); return { ...data, is_host: data.host_id === U.id } } const q = fq(id); return { ...q, is_host: q.host === U.name } },
            members: async id => SB ? call("get_quiz_members", { p_quiz: id }) : fq(id).m.map(n => ({ uid: n, display_name: n, is_host: n === fq(id).host })),
            act: async (fn, id) => { if (SB) return call(fn, { p_quiz: id }); const q = fq(id); if (fn === "start_quiz") q.status = "live"; else if (fn === "close_quiz") q.status = "closed"; else q.m = q.m.filter(n => n !== U.name) }
        };
        const qtag = s => `<span class="tag ${s === "lobby" ? "upcoming" : s}">${s === "lobby" ? "open to join" : s}</span>`;
        async function quizzes(A) {
            A.innerHTML = `<h1>Quizzes</h1><p class="mut">Host your own quiz for friends or a class, or join one with a code.</p>
<div class="grid" style="margin:18px 0"><div class="card"><h2>Join a quiz</h2><form onsubmit="return joinQ(event)"><label>Quiz code</label><input name="c" maxlength="6" required autocomplete="off" placeholder="K7PX2M" style="text-transform:uppercase;font-family:var(--m);letter-spacing:.15em"><button class="btn p" style="margin-top:12px">Join quiz</button></form></div>
<div class="card"><h2>Create a quiz</h2><p class="mut">Choose a title, how many people can join and how long it runs. You get a code to share.</p><button class="btn p" onclick="newQ()">Create quiz</button></div></div>
<h2>My quizzes</h2><div id="mq" class="mut">Loading your quizzes\u2026</div>`;
            try {
                const L = await QA.mine(), e = $("#mq"); if (!e) return; e.className = "";
                e.innerHTML = L.length ? tbl(["Title", "Code", "Members", "Status", ""], L.map(q => [`<b>${esc(q.title)}</b>${q.is_host ? ' <span class="tag">host</span>' : ""}`, `<span class="num">${esc(q.code)}</span>`, `<span class="num">${q.members} / ${q.member_limit}</span>`, qtag(q.status), `<a class="btn s" href="#/quiz/${q.id}">Open</a>`])) : '<div class="card empty">You have not created or joined a quiz yet. Enter a code above, or create one.</div>'
            }
            catch (x) { const e = $("#mq"); if (e) e.innerHTML = `<div class="card empty">Could not load your quizzes. ${esc(x.message)}</div>` }
        }
        async function joinQ(e) { e.preventDefault(); const b = e.target.querySelector("button"); b.disabled = true; try { const q = await QA.join(new FormData(e.target).get("c")); toast("Joined " + q.title); location.hash = "#/quiz/" + q.id } catch (x) { toast(x.message); b.disabled = false } return false }
        function newQ() { modal("Create a quiz", `<label>Quiz title</label><input name="t" required minlength="3" maxlength="60" placeholder="Friday DSA warm-up"><label>Member limit (including you)</label><input name="l" type="number" min="2" max="500" value="20" required><label>Duration (minutes)</label><input name="d" type="number" min="5" max="180" value="20" required>`, d => { QA.create(d.t, +d.l, +d.d).then(q => { toast("Quiz created. Share code " + q.code); location.hash = "#/quiz/" + q.id }).catch(x => toast(x.message)) }, "Create quiz") }
        async function quizLobby(A, id) {
            let busy = 0;
            const draw = async () => {
                try {
                    const q = await QA.get(id), M = await QA.members(id), full = M.length >= q.member_limit;
                    A.innerHTML = `<a class="mut" href="#/quizzes">\u2190 All quizzes</a><div class="card" style="margin-top:12px;max-width:720px"><div class="row sp">${qtag(q.status)}<span class="num ${full ? "dn" : "mut"}">${M.length} / ${q.member_limit} joined${full ? " \u00b7 full" : ""}</span></div>
<h1 style="margin-top:8px">${esc(q.title)}</h1><p class="mut">${q.duration_min} minutes \u00b7 hosted by ${esc(M.find(m => m.is_host)?.display_name || "the host")}</p>
<label>Share this code to invite people</label><div class="row"><b class="num" style="font-size:34px;letter-spacing:.2em">${esc(q.code)}</b><button class="btn s" onclick="copyCode('${esc(q.code)}')">Copy code</button></div>
<div class="bar2" style="margin:16px 0"><i style="width:${M.length / q.member_limit * 100}%"></i></div><h2>Members</h2><div class="row">${M.map(m => `<span class="tag ${m.is_host ? "live" : ""}">${esc(m.display_name)}${m.is_host ? " (host)" : ""}${m.display_name === U.name ? " (you)" : ""}</span>`).join("")}</div>
<div class="row" style="margin-top:20px">${q.status === "lobby" ? (q.is_host ? `<button class="btn p" onclick="qAct('start_quiz','${id}')">Start quiz</button>` : '<span class="mut">Waiting for the host to start\u2026</span>') : q.status === "live" ? '<span class="tag live"><span class="pulse">\u25cf</span> Quiz is live. Questions will be added in the next update.</span>' : '<span class="mut">This quiz is closed.</span>'}
${q.is_host && q.status !== "closed" ? `<button class="btn d" onclick="qAct('close_quiz','${id}')">Close quiz</button>` : ""}${!q.is_host && q.status === "lobby" ? `<button class="btn" onclick="qAct('leave_quiz','${id}')">Leave quiz</button>` : ""}</div></div>`
                }
                catch (x) { A.innerHTML = `<div class="card empty">${esc(x.message || "Quiz not found")}<br><a class="btn" style="margin-top:12px;display:inline-block" href="#/quizzes">Back to quizzes</a></div>`; clearInterval(tick) }
            };
            const refresh = () => { if (!busy) { busy = 1; draw().finally(() => busy = 0) } };
            await draw(); tick = setInterval(refresh, 4000); RT.join("q" + id, (u, mode, m) => { if (m) refresh() })
        }
        async function qAct(fn, id) { try { await QA.act(fn, id); toast({ start_quiz: "Quiz started", close_quiz: "Quiz closed", leave_quiz: "You left the quiz" }[fn]); if (fn === "leave_quiz") location.hash = "#/quizzes"; else route() } catch (x) { toast(x.message) } }
        async function copyCode(c) { try { await navigator.clipboard.writeText(c); toast("Code copied") } catch (e) { toast("Copy failed. Code is " + c) } }
        function tbl(h, rows, empty) { return rows.length ? `<div class="card tw" style="padding:4px 8px"><table><thead><tr>${h.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="card empty">${empty}</div>` }
        function board_(A) {
            const draw = () => { const r = ranked(); A.innerHTML = `<div class="row sp"><div><h1>${pub ? "Final leaderboard" : "Live leaderboard"}</h1><p class="mut">Sorted by total score, then by lower total time.</p></div><span class="tag ${pub ? "ok" : "live"}">${pub ? "final · published" : '<span class="pulse">●</span> live'}</span></div><div class="card tw" style="padding:4px 8px;margin-top:14px"><table><thead><tr><th>Rank</th><th>Participant</th><th>Quiz</th><th>Coding</th><th>Debug</th><th>Final</th><th>Total</th></tr></thead><tbody>${r.map(x => `<tr class="${x.me ? "me" : ""}"><td class="rk">${x.rk <= 3 ? ["🥇", "🥈", "🥉"][x.rk - 1] : "#" + x.rk}</td><td>${esc(x.n)}</td>${x.s.map(v => `<td class="num">${v}</td>`).join("")}<td class="num"><b>${x.sum}</b></td></tr>`).join("")}</tbody></table></div>` }; draw();
            if (!pub) tick = setInterval(() => { const b = board[Math.floor(Math.random() * board.length)]; b.s[0] += 10 * (Math.random() < .5); draw() }, 4000)
        }
        function admin(A, p) {
            if (p === "rounds") { A.innerHTML = `<div class="row sp"><h1>Rounds</h1><button class="btn p" onclick="editR()">New round</button></div><div style="margin-top:14px">${tbl(["Round", "Type", "Status", "Minutes", "Cut-off %", ""], rounds.map(r => [`<b>${esc(r.name)}</b>`, r.type, `<span class="tag ${r.status}">${r.status}</span>`, r.dur, r.cut, `<button class="btn s" onclick="editR(${r.id})">Edit</button> <button class="btn s d" onclick="delR(${r.id})">Delete</button>`]), "No rounds yet. Create the first one.")}</div>` }
            else if (p === "questions") { A.innerHTML = `<div class="row sp"><h1>Questions</h1><button class="btn p" onclick="editQ()">New question</button></div><div style="margin-top:14px">${tbl(["Round", "Question", "Points", ""], qs.map(q => [esc(rounds.find(r => r.id === q.r)?.name || "?"), esc(q.t), q.pts, `<button class="btn s" onclick="editQ(${q.id})">Edit</button> <button class="btn s d" onclick="delQ(${q.id})">Delete</button>`]), "No questions yet.")}</div>` }
            else if (p === "subs") { A.innerHTML = `<h1>Submissions</h1><p class="mut">Review scores and re-evaluate if a test case was wrong.</p><div style="margin-top:14px">${tbl(["Participant", "Round", "Item", "Score", "Status", ""], subs.map(s => [esc(s.u), esc(rounds.find(r => r.id === s.r)?.name), s.q, s.s, `<span class="tag ${s.st === "graded" ? "ok" : ""}">${s.st}</span>`, `<button class="btn s" onclick="regrade(${s.id})">Re-evaluate</button> <button class="btn s d" onclick="delS(${s.id})">Remove</button>`]), "No submissions yet.")}</div>` }
            else { const r = ranked(); A.innerHTML = `<h1>Results</h1><div class="card" style="max-width:560px;margin:14px 0"><h2>${pub ? "Results are public" : "Results are hidden"}</h2><p class="mut">${pub ? "Everyone can see the final leaderboard." : "Participants only see the live ranking. Publish when all rounds are closed and checked."}</p><button class="btn p" onclick="pub=!pub;toast(pub?'Published':'Unpublished');admin($('#app'),'results')">${pub ? "Unpublish results" : "Publish results"}</button></div><h2>Qualified for the Final Battle</h2><p class="mut">Top ${Math.min(5, r.length)} by total score.</p>${tbl(["Rank", "Participant", "Total"], r.slice(0, 5).map(x => ["#" + x.rk, esc(x.n), x.sum]))}` }
        }
        function modal(t, body, ok, lab) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="card" role="dialog" aria-label="${t}"><h2>${t}</h2><form>${body}<div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">${lab || "Save changes"}</button></div></form></div>`; document.body.appendChild(m); m.querySelector("#cx").onclick = () => m.remove(); m.querySelector("form").onsubmit = e => { e.preventDefault(); ok(Object.fromEntries(new FormData(e.target))); m.remove(); route() }; m.querySelector("input,select").focus() }
        const sel = (n, v, o) => `<select name="${n}">${o.map(x => `<option ${x === v || x[0] === v ? "selected" : ""} value="${[].concat(x)[0]}">${[].concat(x).pop()}</option>`).join("")}</select>`;
        function editR(id) { const r = rounds.find(x => x.id === id) || { name: "", type: "quiz", status: "draft", dur: 30, cut: 50, desc: "" }; modal(id ? "Edit round" : "New round", `<label>Name</label><input name="name" required value="${esc(r.name)}"><label>Type</label>${sel("type", r.type, ["quiz", "code", "debug"])}<label>Status</label>${sel("status", r.status, ["draft", "upcoming", "live", "closed"])}<label>Duration (minutes)</label><input name="dur" type="number" min="1" required value="${r.dur}"><label>Qualifying score (%)</label><input name="cut" type="number" min="0" max="100" value="${r.cut}"><label>Description</label><textarea name="desc" rows="3">${esc(r.desc)}</textarea>`, d => { d.dur = +d.dur; d.cut = +d.cut; if (id) Object.assign(r, d); else rounds.push({ id: ++uid, ...d }); toast(id ? "Round updated" : "Round created") }) }
        function delR(id) { if (confirm("Delete this round and its questions?")) { rounds = rounds.filter(r => r.id !== id); qs = qs.filter(q => q.r !== id); toast("Round deleted"); route() } }
        function editQ(id) { const q = qs.find(x => x.id === id) || { r: rounds[0]?.id, t: "", pts: 10, opts: ["", "", "", ""], ans: 0, body: "", tests: 3, start: "" }; modal(id ? "Edit question" : "New question", `<label>Round</label>${sel("r", q.r, rounds.map(r => [r.id, r.name]))}<label>Title or question</label><input name="t" required value="${esc(q.t)}"><label>Points</label><input name="pts" type="number" min="1" value="${q.pts}"><label>Options, one per line (quiz only)</label><textarea name="opts" rows="4">${esc((q.opts || []).join("\n"))}</textarea><label>Correct option number (quiz only)</label><input name="ans" type="number" min="1" value="${(q.ans || 0) + 1}"><label>Problem statement (coding and debugging)</label><textarea name="body" rows="3">${esc(q.body || "")}</textarea><label>Hidden test cases</label><input name="tests" type="number" min="1" value="${q.tests || 3}"><label>Starter code</label><textarea name="start" rows="4" class="code" style="min-height:0">${esc(q.start || "")}</textarea>`, d => { const o = { r: +d.r, t: d.t, pts: +d.pts, opts: d.opts.split("\n").filter(Boolean), ans: d.ans - 1, body: d.body, tests: +d.tests, start: d.start }; if (id) Object.assign(q, o); else qs.push({ id: ++uid, ...o }); toast(id ? "Question updated" : "Question created") }) }
        function delQ(id) { if (confirm("Delete this question?")) { qs = qs.filter(q => q.id !== id); toast("Question deleted"); route() } }
        function regrade(id) { const s = subs.find(x => x.id === id); s.st = "re-evaluated"; toast("Re-evaluated"); route() }
        function delS(id) { subs = subs.filter(s => s.id !== id); toast("Submission removed"); route() }
        init();
    </script>
</body>

</html>
